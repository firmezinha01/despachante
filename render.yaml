services:
  - type: web
    name: despachante-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://hkbvlwkivntxohvbrcnw.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
